---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "05 10 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

env:
  IMAGE_DESC: "Experimental arch-bootc POC image"
  IMAGE_KEYWORDS: "bootc,archlinux,arch"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/230667510?s=400&u=cb912a5db49aee164a609a0fb4967d2d8170feb9&v=4"
  BASE_IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

jobs:
  build_push:
    name: Build and push ${{ matrix.desktop }} image
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        desktop: ["kde", "gnome"]
    runs-on: ubuntu-24.04
    
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo docker system prune -af || true

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Prepare environment
        run: |
          BASE_NAME="${BASE_IMAGE_NAME,,}"
          DESKTOP_LOWER=$(echo "${{ matrix.desktop }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${BASE_NAME}-${DESKTOP_LOWER}" >> ${GITHUB_ENV}
        env:
          BASE_IMAGE_NAME: ${{ env.BASE_IMAGE_NAME }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}

      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> ${GITHUB_OUTPUT}

      - name: Image Metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5
        id: metadata
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            containers.bootc=1
            desktop.environment=${{ matrix.desktop }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }},${{ matrix.desktop }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.BASE_IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }} (${{ matrix.desktop }})
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.BASE_IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.BASE_IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.BASE_IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}

      - name: Build image
        id: build
        env:
          LABELS: ${{ steps.metadata.outputs.labels }}
        run: |
          LABEL_ARGS=""
          while IFS= read -r LABEL; do
            [ -z "${LABEL}" ] && continue
            LABEL_ARGS="${LABEL_ARGS} --label \"${LABEL}\""
          done <<< "${LABELS}"
          
          eval podman build \
            --build-arg DESKTOP="${{ matrix.desktop }}" \
            ${LABEL_ARGS} \
            -t "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            -f ./Containerfile .

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN_USER: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | podman login -u "${LOGIN_USER}" --password-stdin "ghcr.io"
          echo "${GITHUB_TOKEN}" | docker login -u "${LOGIN_USER}" --password-stdin "ghcr.io"

      - name: Push to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
          MAX_RETRIES: 3
        run: |
          set -x
          
          while IFS= read -r TAG; do
            [ -z "${TAG}" ] && continue
            for i in $(seq "${MAX_RETRIES}"); do
              podman push --digestfile=/tmp/digestfile \
                "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
                "${TAG}" && break || sleep $((5 * i))
            done
          done <<< "${TAGS}"
          
          echo "remote_image_digest=$(cat /tmp/digestfile)" >> ${GITHUB_OUTPUT}

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r TAG; do
            [ -z "${TAG}" ] && continue
            cosign sign -y \
              --key env://COSIGN_PRIVATE_KEY \
              "${TAG}"
          done <<< "${TAGS}"